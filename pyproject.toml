[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "farstar-tunnel"
version = "1.0.0"
description = "Isolated, self-hosted two-node tunnel management"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "cryptography==50.0.2",
  "httpx==0.28.1", "psutil==7.2.2"
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
farstar = "farstar.cli:main"

[tool.setuptools.packages.find]
include = ["farstar*"]

[tool.setuptools.package-data]
farstar = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
